<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    
    <style>
:root {
    /* Colors (Neutral background, card surfaces, and a vibrant primary accent) */
    --bg-color: #0f172a;        /* Deep modern slate background */
    --card-bg: #1e293b;         /* Slightly lighter slate for cards & containers */
    --text-main: #f8fafc;       /* Crisp white/off-white for headings */
    --text-muted: #94a3b8;      /* Muted gray for body text */
    --primary: #6366f1;         /* Vibrant indigo accent for buttons & links */
    --primary-hover: #4f46e5;   /* Darker indigo when hovering */
    --accent: #22c55e;          /* Success green for feedback states */
    
    /* Borders & Shadows */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-subtle: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);

    /* Typography */
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

/* Global Reset & Base Styling using your variables */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth; /* Makes clicking nav links scroll smoothly down the page */
}

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-sans);
    line-height: 1.6;
}
    </style>
</head>
<body>
    
</body>
</html>
